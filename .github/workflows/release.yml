name: Build and Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag / Versi Rilis (contoh: v1.0.10)'
        required: true
        default: 'v1.0.10'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK Release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: flutter build apk --release --android-skip-build-dependency-validation --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Verify APK Signature
        run: |
          jarsigner -verify -verbose build/app/outputs/flutter-apk/app-release.apk || true

      - name: Prepare APK Asset
        id: prep
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          FILENAME="DSA_XL_Satu_Handbook_${TAG}_android.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$FILENAME"
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: ${{ steps.prep.outputs.filename }}

  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: powershell
        run: |
          $dartDefines = @()
          if ($env:SUPABASE_URL) { $dartDefines += "--dart-define=SUPABASE_URL=$env:SUPABASE_URL" }
          if ($env:SUPABASE_ANON_KEY) { $dartDefines += "--dart-define=SUPABASE_ANON_KEY=$env:SUPABASE_ANON_KEY" }
          flutter build windows --release $dartDefines

      - name: Setup Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress --ignore-package-exit-codes

      - name: Prepare Build Output for Inno Setup
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "Output"
          New-Item -ItemType Directory -Force -Path "build\windows\x64\runner\Release"
          if (Test-Path "build\windows\runner\Release") {
            Copy-Item -Recurse "build\windows\runner\Release\*" "build\windows\x64\runner\Release" -Force
          }

      - name: Compile Inno Setup Installer
        shell: powershell
        continue-on-error: true
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User") + ";C:\Program Files (x86)\Inno Setup 6;C:\Program Files\Inno Setup 6;C:\Program Files\Inno Setup 7;C:\tools\InnoSetup;C:\ProgramData\chocolatey\bin"
          $isccCandidates = @(
            (Get-Command iscc -ErrorAction SilentlyContinue)?.Source,
            "C:\ProgramData\chocolatey\bin\iscc.exe",
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 7\ISCC.exe",
            "C:\tools\InnoSetup\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path $_) }

          if ($isccCandidates.Count -gt 0) {
            $iscc = $isccCandidates[0]
            Write-Host "Compiling Inno Setup with: $iscc"
            & $iscc windows_installer.iss
          } else {
            Write-Warning "ISCC.exe not found in standard paths, skipping installer exe creation."
          }

      - name: Prepare Windows Assets
        id: prep_win
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ github.event.inputs.tag_name }}"
          }
          
          # Locate Release directory
          $releaseDir = "build\windows\x64\runner\Release"
          if (-not (Test-Path "$releaseDir\dsa_incentive_tracker.exe")) {
            if (Test-Path "build\windows\runner\Release\dsa_incentive_tracker.exe") {
              $releaseDir = "build\windows\runner\Release"
            }
          }
          Write-Host "Packaging portable zip from: $releaseDir"
          Compress-Archive -Path "$releaseDir\*" -DestinationPath "DSA_XL_Satu_Handbook_${tag}_windows_portable.zip" -Force

          # Copy setup installer output if exists
          $installer = Get-ChildItem -Path "Output\*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($installer) {
            Copy-Item $installer.FullName "DSA_XL_Satu_Handbook_${tag}_windows_installer.exe" -Force
            Write-Host "Prepared installer: DSA_XL_Satu_Handbook_${tag}_windows_installer.exe"
          } else {
            Write-Warning "No installer EXE found in Output directory; portable zip will be the primary Windows release asset."
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: |
            DSA_XL_Satu_Handbook_*_windows_installer.exe
            DSA_XL_Satu_Handbook_*_windows_portable.zip
          if-no-files-found: warn

  create-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Determine Release Tag
        id: tag_info
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: DSA XL Satu Handbook ${{ steps.tag_info.outputs.tag }}
          generate_release_notes: true
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
